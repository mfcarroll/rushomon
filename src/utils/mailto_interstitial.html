<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="0;url=<!--HREF-->" />
    <title>Opening your email app…</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #f9fafb;
        color: #111827;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 26rem;
        width: 100%;
      }
      .icon {
        width: 2.5rem;
        height: 2.5rem;
        color: #f97316;
        margin: 0 auto 1rem;
      }
      h1 {
        font-size: 1.125rem;
        font-weight: 600;
        margin: 0 0 1rem;
      }
      .preview {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 0.75rem;
        padding: 0 1rem;
        margin-bottom: 1.25rem;
        text-align: left;
      }
      .row {
        display: flex;
        gap: 0.75rem;
        padding: 0.625rem 0;
        border-bottom: 1px solid #f3f4f6;
        font-size: 0.8125rem;
      }
      .row:last-child {
        border-bottom: none;
      }
      .label {
        flex: 0 0 3.5rem;
        color: #9ca3af;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        font-size: 0.6875rem;
        padding-top: 0.125rem;
      }
      .value {
        flex: 1;
        color: #374151;
        word-break: break-word;
        min-width: 0;
      }
      .value-multiline {
        white-space: pre-wrap;
      }
      .button {
        display: inline-block;
        padding: 0.75rem 2rem;
        background: #f97316;
        color: #fff;
        font-weight: 600;
        font-size: 0.9375rem;
        border-radius: 0.75rem;
        text-decoration: none;
      }
      .hint {
        font-size: 0.75rem;
        color: #9ca3af;
        margin-top: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg
        class="icon"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
        />
      </svg>
      <h1>Opening your email app…</h1>
      <p class="hint">
        If it doesn't open automatically, use the button below.
      </p>
      <div class="preview">
        <!--ROWS-->
      </div>
      <a class="button" href="<!--HREF-->">Open Email App</a>
    </div>
    <script>
      window.location.href = "<!--JS-->";
    </script>
  </body>
</html>
